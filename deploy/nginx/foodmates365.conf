# Food Mate — Nginx 反代配置（foodmates365.com）
# 安装：复制到 /etc/nginx/sites-available/ 并启用，证书路径按 Origin Certificate 调整

upstream foodmate_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream foodmate_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name foodmates365.com www.foodmates365.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foodmates365.com www.foodmates365.com;

    # Cloudflare Origin Certificate（推荐 Full strict）
    # 将证书放到以下路径，或改成 Let's Encrypt 路径
    ssl_certificate     /etc/ssl/foodmate/origin.pem;
    ssl_certificate_key /etc/ssl/foodmate/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    # 后端 API（含 SSE 流式聊天）
    location /api/ {
        proxy_pass http://foodmate_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE：关闭缓冲，拉长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # FastAPI 文档（可选；不需要时可删除）
    location /docs {
        proxy_pass http://foodmate_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://foodmate_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 前端
    location / {
        proxy_pass http://foodmate_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
